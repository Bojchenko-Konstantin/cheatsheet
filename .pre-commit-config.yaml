repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: check-toml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added_large_files
-   repo: https://github.com/psf/black
    rev: 25.1.0 # здесь пишем актуальную версию Black
    hooks:
    -   id: black
